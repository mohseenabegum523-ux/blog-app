<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Simple Blogging Platform</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <div class="logo">📝 BlogSpace</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <span id="navLoggedIn" class="hidden">
                <a href="create.html">+ Create Blog</a>
                <span id="navUsername"></span>
                <button id="logoutBtn" class="btn-secondary" style="background:none;border:1px solid #dbe3ee;cursor:pointer;">Logout</button>
            </span>
            <span id="navLoggedOut" class="hidden">
                <a href="login.html">Login</a>
                <a href="register.html" class="btn-primary-link">Register</a>
            </span>
        </div>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->
    <main>
        <div class="form-card">
            <h2>Create an Account</h2>
            <p class="sub-text">Join BlogSpace and start sharing your stories.</p>

            <!-- Feedback message (success/error) -->
            <div id="registerMessage" class="message-box"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. john_doe" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <p class="form-footer-text">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>

    <footer>
        Simple Blogging Platform &mdash; Built with Node.js, Express &amp; MySQL
    </footer>

    <script src="script.js"></script>
</body>
</html>
